[project]
name = "costco-prices-backend"
version = "0.1.0"
description = "Track Costco prices over time from receipt images."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.40",
    "alembic>=1.15.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.1.0",
    "anthropic>=0.51.0",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1.0",
    "pymupdf>=1.24.0",
    "aiosqlite>=0.22.1",
    # Shared ZombieTech code (Caddy registration, dev-runner helpers, SMTP) from ../infra.
    "zt-common",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.uv]
link-mode = "symlink"

# ai: claude-opus-5-5 | 2026-09-28
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
norecursedirs = [".venv", "alembic", "__pycache__"]

[tool.uv.sources]
zt-common = { path = "../../infra/zt-common", editable = true }
